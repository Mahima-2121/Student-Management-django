<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Student Management System{% endblock %}</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #333;
      min-height: 100vh;
    }

    /* ── NAVBAR ── */
    .navbar {
      background: #1a237e;
      color: white;
      padding: 0 30px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: white;
    }

    .navbar-brand .logo {
      width: 34px;
      height: 34px;
      background: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: #1a237e;
    }

    .navbar-brand span {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .navbar-links {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .navbar-links a {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 14px;
      padding: 7px 14px;
      border-radius: 6px;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .navbar-links a:hover {
      background: rgba(255,255,255,0.15);
      color: white;
    }

    .navbar-links a.active {
      background: rgba(255,255,255,0.2);
      color: white;
    }

    /* ── CONTAINER ── */
    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* ── MESSAGES ── */
    .messages {
      margin-bottom: 20px;
    }

    .alert {
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .alert-success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }

    .alert-error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.98); }

    .btn-primary   { background: #1a237e; color: white; }
    .btn-success   { background: #2e7d32; color: white; }
    .btn-warning   { background: #e65100; color: white; }
    .btn-danger    { background: #c62828; color: white; }
    .btn-secondary { background: #546e7a; color: white; }
    .btn-outline   {
      background: transparent;
      color: #1a237e;
      border: 1.5px solid #1a237e;
    }

    .btn-sm {
      padding: 5px 12px;
      font-size: 12px;
    }

    /* ── CARD ── */
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid #e0e0e0;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: #1a237e;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 2px solid #e8eaf6;
    }

    /* ── TABLE ── */
    .table-wrap {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e0e0e0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: #1a237e;
      color: white;
      padding: 13px 16px;
      text-align: left;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    tbody td {
      padding: 12px 16px;
      font-size: 13px;
      border-bottom: 1px solid #f0f0f0;
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover td {
      background: #f5f7ff;
    }

    /* ── BADGES ── */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 500;
    }

    .badge-active   { background: #e8f5e9; color: #2e7d32; }
    .badge-inactive { background: #ffebee; color: #c62828; }
    .badge-male     { background: #e3f2fd; color: #1565c0; }
    .badge-female   { background: #fce4ec; color: #880e4f; }
    .badge-other    { background: #f3e5f5; color: #6a1b9a; }

    /* ── FORM ── */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #444;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #ddd;
      border-radius: 7px;
      font-size: 14px;
      font-family: 'Segoe UI', sans-serif;
      transition: border-color 0.2s;
      background: white;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #1a237e;
      box-shadow: 0 0 0 3px rgba(26,35,126,0.08);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 20px;
    }

    .form-full {
      grid-column: 1 / -1;
    }

    .form-error {
      color: #c62828;
      font-size: 12px;
      margin-top: 4px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #444;
      cursor: pointer;
    }

    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* ── PAGE HEADER ── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .page-header h2 {
      font-size: 22px;
      font-weight: 600;
      color: #1a237e;
    }

    .page-header p {
      font-size: 13px;
      color: #888;
      margin-top: 3px;
    }

    /* ── SEARCH BAR ── */
    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-bar input,
    .search-bar select {
      padding: 9px 14px;
      border: 1.5px solid #ddd;
      border-radius: 7px;
      font-size: 14px;
      font-family: 'Segoe UI', sans-serif;
      flex: 1;
      min-width: 180px;
    }

    .search-bar input:focus,
    .search-bar select:focus {
      outline: none;
      border-color: #1a237e;
    }

    /* ── STAT CARDS ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      border: 1px solid #e0e0e0;
    }

    .stat-card .stat-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .stat-card .stat-num {
      font-size: 30px;
      font-weight: 700;
      color: #1a237e;
      line-height: 1;
    }

    .stat-card .stat-label {
      font-size: 12px;
      color: #888;
      margin-top: 5px;
    }

    /* ── AVATAR ── */
    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #e8eaf6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      color: #1a237e;
      flex-shrink: 0;
    }

    /* ── DETAIL GRID ── */
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 30px;
    }

    .detail-item label {
      font-size: 12px;
      color: #888;
      font-weight: 400;
      display: block;
      margin-bottom: 3px;
    }

    .detail-item p {
      font-size: 15px;
      font-weight: 500;
      color: #222;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
    }

    .empty-state .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 15px;
      margin-bottom: 16px;
    }

    /* ── FOOTER ── */
    .footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #aaa;
      margin-top: 40px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .form-grid    { grid-template-columns: 1fr; }
      .detail-grid  { grid-template-columns: 1fr; }
      .stat-grid    { grid-template-columns: 1fr 1fr; }
      .navbar-links a span { display: none; }
      .page-header  { flex-direction: column; align-items: flex-start; gap: 10px; }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="{% url 'student_list' %}" class="navbar-brand">
    <div class="logo">S</div>
    <span>SMS Portal</span>
  </a>
  <div class="navbar-links">
    <a href="{% url 'student_list' %}">
      &#128100; <span>All Students</span>
    </a>
    <a href="{% url 'student_create' %}">
      &#43; <span>Add Student</span>
    </a>
    <a href="/admin/">
      &#9881; <span>Admin</span>
    </a>
  </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container">

  <!-- FLASH MESSAGES -->
  {% if messages %}
    <div class="messages">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
          &#10003; {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <!-- PAGE CONTENT -->
  {% block content %}
  {% endblock %}

</div>

<!-- FOOTER -->
<footer class="footer">
  Student Management System &copy; 2026 &mdash; Built with Django
</footer>

</body>
</html>
